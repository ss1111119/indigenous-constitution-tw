# 探測戶政司 ODRP 是否發布新期別，有的話重跑轉檔、提交資料、並觸發重新發佈。
#
# 沒有新期別的日子，這個流程不留下任何 commit、也不觸發部署——排程每天跑，
# 但版本庫的歷史只在資料真的變動時才增加一筆。
#
# 為何需要明確觸發部署（決策二）：以 GITHUB_TOKEN 推送的 commit 不會觸發其他 workflow
# 的 push 事件（GitHub 的遞迴防護）。若不處理，資料會更新進版本庫但站台不會重新發佈——
# 而且流程還是綠燈，沒有人會發現。
#
# 權限與 deploy.yml 不同：這裡要寫版本庫（contents: write）與觸發其他流程
# （actions: write），deploy.yml 只需讀原始碼。
#
# 失敗即紅燈，不靜默略過：排程長期無人看管，紅燈是唯一會被注意到的訊號。
# 唯一「沒事發生」的正常結局是探測不到新期別。
#
# 變動幅度檢查的放行（決策九）只在手動觸發時可用，且必須同時給定「勾選放行」與
# 「放行理由」；理由會寫進 commit 訊息。排程觸發一律不帶放行參數——這是刻意的：
# 若排程能自我放行，幅度檢查就擋不住任何東西。門檻本身沒有調整的入口。

name: Refresh population data

on:
  # UTC 21:00 = 臺北時間隔日 05:00。ODRP 的發布日不固定、滯後約兩個月，
  # 故每日探測；成本只是一次 HTTP 請求，而每週探測最多會延遲 6 天。
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: '指定期別（民國年月，如 11507）。留空則自動探測。'
        required: false
        type: string
      # 放行只存在於 workflow_dispatch，schedule 沒有這兩個輸入可用——這是
      # 「排程不得自我放行」的第一道結構性保證，下面的 Resolve override 是第二道。
      accept_large_change:
        description: '放行超過 ±1% 的變動（須同時填寫放行理由）。僅在人工確認變動為真實時使用。'
        required: false
        type: boolean
        default: false
      override_reason:
        description: '放行理由（accept_large_change 勾選時必填）。將寫入 commit 訊息。'
        required: false
        type: string

permissions:
  contents: write
  actions: write

# 同時只跑一個。兩個流程同時轉檔並推送必然衝突，而中途取消可能停在
# 「已提交但未觸發部署」的狀態。
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 決定要轉哪一期。手動指定時略過探測——那是給「已人工確認、需要重跑」用的，
      # 例如幅度檢查擋下了一次真實的大幅變動。其餘驗證一律照常套用。
      # 手動輸入經由環境變數傳入而非直接內插進腳本：內插會讓 workflow 輸入變成
      # 可執行的程式碼片段。並強制 5 碼數字，把「11507」以外的東西擋在打 API 之前。
      - name: Resolve period
        id: period
        shell: pwsh
        env:
          MANUAL_PERIOD: ${{ inputs.period }}
        run: |
          $manual = "$env:MANUAL_PERIOD".Trim()
          if($manual){
            if($manual -notmatch '^\d{5}$'){
              throw "期別格式不正確：『$manual』。應為 5 碼民國年月，如 11507。"
            }
            Write-Host "手動指定期別：$manual（略過探測）"
            "period=$manual" >> $env:GITHUB_OUTPUT
          } else {
            # 探測腳本失敗時會擲出例外，GitHub 的 pwsh 以 ErrorActionPreference=Stop
            # 執行，該步驟隨之失敗。不自行檢查 $LASTEXITCODE——它對 .ps1 不會被設定，
            # 未定義時的比較會走進「exit $null」，那等於把失敗靜靜報成沒有新期別。
            $probed = (& ./scripts/probe-odrp-period.ps1 | Select-Object -Last 1)
            "period=$probed" >> $env:GITHUB_OUTPUT
          }

      - name: No new period
        if: steps.period.outputs.period == ''
        run: echo '沒有比版本庫記載更新的期別，正常結束：不提交、不部署。'

      # 放行參數只在手動觸發時成立（design 決策九）。排程觸發一律不帶——排程長期
      # 無人看管，若它能自我放行，幅度檢查這道防線就形同虛設。這裡明確以 event_name
      # 判斷而非只依賴「schedule 沒有 inputs」，是為了讓意圖寫在流程裡而非隱含在
      # GitHub 的行為中；日後若新增其他觸發方式，預設仍是不放行。
      # 兩個參數的並用檢查在此先做一次，好在下載與轉檔之前就擋下操作失誤——
      # 轉檔腳本自己也會檢查，那是實際的把關，這裡只是提早失敗。
      - name: Resolve override
        id: override
        shell: pwsh
        env:
          EVENT_NAME:   ${{ github.event_name }}
          INPUT_ACCEPT: ${{ inputs.accept_large_change }}
          INPUT_REASON: ${{ inputs.override_reason }}
        run: |
          if($env:EVENT_NAME -ne 'workflow_dispatch'){
            Write-Host "觸發方式為 $env:EVENT_NAME，不套用任何放行參數。"
            'accept=false' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $accept = "$env:INPUT_ACCEPT" -eq 'true'
          $reason = "$env:INPUT_REASON".Trim()

          if($accept -and -not $reason){
            throw '放行參數不完整：勾選了 accept_large_change 但未填 override_reason。放行必須具名。'
          }
          if($reason -and -not $accept){
            throw '放行參數不完整：填了 override_reason 但未勾選 accept_large_change。理由本身不構成放行。'
          }

          if($accept){
            Write-Host "已指定具名放行，理由：$reason"
            'accept=true' >> $env:GITHUB_OUTPUT
            # 理由可能含換行，用多行輸出格式；分隔符取不會出現在人寫的理由中的字串。
            "reason<<__REASON_EOF__"  >> $env:GITHUB_OUTPUT
            $reason                   >> $env:GITHUB_OUTPUT
            '__REASON_EOF__'          >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '未指定放行，幅度檢查照常擋下超過 ±1% 的變動。'
            'accept=false' >> $env:GITHUB_OUTPUT
          }

      # --- 以下步驟只在有期別可轉時執行 ---

      # 登記必須在轉檔之前：轉檔腳本會拒絕未登記的 sourceId。
      # 已登記過的期別（例如重跑）會被略過，不會產生重複記錄。
      - name: Register period in sources.json
        if: steps.period.outputs.period != ''
        run: python scripts/register-period.py register ${{ steps.period.outputs.period }}

      # 以 fetch-raw.py 取原始檔而非讓轉檔腳本自己下載：它會依 totalPage 逐頁合併
      # 並核對宣告列數，缺頁即失敗。ODRP 分頁一次只回 2000 列，村里層級有 7,700 餘列。
      - name: Fetch raw inputs
        if: steps.period.outputs.period != ''
        run: |
          python scripts/fetch-raw.py moi-odrp013-${{ steps.period.outputs.period }}
          python scripts/fetch-raw.py moi-odrp018-${{ steps.period.outputs.period }}

      - name: Record checksums
        if: steps.period.outputs.period != ''
        run: python scripts/register-period.py seal ${{ steps.period.outputs.period }}

      # 轉檔內含加總自我驗證與變動幅度檢查。任一未過即以非零狀態碼中止且不產出檔案，
      # job 隨之失敗，後面的提交與部署都不會執行——絕不把異常數字推上線。
      # 放行時要把「放行了多大的變動」記進 commit 訊息，故需取回腳本算出的百分比。
      # Write-Host 走的是資訊串流，用 6>&1 併進成功串流才抓得到；抓到後照原樣印出，
      # 流程紀錄的可讀性不變。
      - name: Convert
        id: convert
        if: steps.period.outputs.period != ''
        shell: pwsh
        env:
          OVERRIDE_ACCEPT: ${{ steps.override.outputs.accept }}
          OVERRIDE_REASON: ${{ steps.override.outputs.reason }}
        run: |
          # 用雜湊表展開而非陣列：陣列展開不會讓 [switch] 正確綁定，
          # -AcceptLargeChange 會被吃掉，結果是「給了理由卻沒放行」而中止。
          $buildArgs = @{ Period = '${{ steps.period.outputs.period }}' }
          if($env:OVERRIDE_ACCEPT -eq 'true'){
            $buildArgs['AcceptLargeChange'] = $true
            $buildArgs['OverrideReason']    = $env:OVERRIDE_REASON
          }

          $output = & ./scripts/build-population.ps1 @buildArgs 6>&1
          $output | ForEach-Object { Write-Host $_ }

          # 一律解析轉檔輸出的機器可讀標記，不比對任何中文訊息——那些訊息是寫給
          # 讀流程紀錄的人看的，措辭隨時可能改寫，而消費它的路徑只在放行時才走到，
          # 斷掉的那天正好是第一次真的需要放行的那天。
          $marker = $output | Where-Object { "$_" -match 'REFRESH_AMPLITUDE=' } | Select-Object -First 1

          if(-not $marker){
            throw '轉檔未輸出幅度檢查標記，流程與轉檔腳本已不同步。'
          }

          if("$marker" -match 'REFRESH_AMPLITUDE=skipped'){
            # 無可比基準：沒有「觀察到的變動」可言，不報百分比。這是正常情況，不得失敗。
            '幅度檢查已略過（無可比基準），本次無變動幅度可回報。' >> $env:GITHUB_STEP_SUMMARY
          } else {
            if("$marker" -match 'DELTA_PCT=([-\d.]+) RELEASED=(true|false)'){
              $delta    = $Matches[1]
              $released = $Matches[2] -eq 'true'
              # 幅度一律記進流程摘要，使這段解析在每一次排程執行中都被真實運行，
              # 而不是等到最需要它正確的那天才第一次跑。
              "觀察到的變動幅度：$delta%（放行：$($Matches[2])）" >> $env:GITHUB_STEP_SUMMARY
              "delta_pct=$delta" >> $env:GITHUB_OUTPUT
              # 只有真的被放行時才在 commit 訊息留放行註記，
              # 否則訊息會宣稱一件沒有發生的事。
              if($released){ "released=true" >> $env:GITHUB_OUTPUT }
            } else {
              throw "標記格式無法解析，流程與轉檔腳本已不同步：$marker"
            }
          }

      # 回歸測試在此再跑一次：轉檔腳本是在 runner 上執行的，本機綠燈不等於這裡綠燈。
      - name: Regression tests
        if: steps.period.outputs.period != ''
        shell: pwsh
        run: ./tests/run-regression.ps1

      # 只提交 data/ 之下的檔案。轉檔不應該動到其他任何東西，
      # 若有，那是需要人看一眼的事，不是可以順手一起提交的。
      - name: Commit data
        id: commit
        if: steps.period.outputs.period != ''
        env:
          OVERRIDE_REASON: ${{ steps.override.outputs.reason }}
          OVERRIDE_DELTA:  ${{ steps.convert.outputs.delta_pct }}
          OVERRIDE_RELEASED: ${{ steps.convert.outputs.released }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed data/sources.json

          # 組裝與「要不要提交」分開。組裝寫在提交分支裡的話，以既有期別重跑
          # （產出相同、不提交）就完全不會執行到它，於是這段程式在真正需要它的
          # 那次大幅變動之前，一次都沒有被觀察過。
          #
          # 組裝本身在 scripts/compose-commit-message.ps1，流程與回歸測試呼叫同一份，
          # 測試才不會測到一份複製品。
          if [ "$OVERRIDE_RELEASED" = 'true' ]; then
            MSG=$(pwsh -NoProfile -File scripts/compose-commit-message.ps1               -Period '${{ steps.period.outputs.period }}'               -Released -DeltaPct "$OVERRIDE_DELTA" -Reason "$OVERRIDE_REASON")
          else
            MSG=$(pwsh -NoProfile -File scripts/compose-commit-message.ps1               -Period '${{ steps.period.outputs.period }}')
          fi

          {
            echo '### 組裝出的 commit 訊息'
            echo '```'
            echo "$MSG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --cached --quiet; then
            echo '產出與版本庫現有檔案相同，不提交。'
            echo '產出與版本庫現有檔案相同，未建立提交。' >> "$GITHUB_STEP_SUMMARY"
            echo 'committed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "$MSG"
            git push
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          fi

      # 明確觸發既有的部署流程，不在此複製組建或發佈邏輯——那會產生第二條部署路徑，
      # 正是 site-deployment 的單一組建路徑要求所要避免的。
      - name: Trigger deployment
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
